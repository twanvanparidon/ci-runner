# Runs inside the docker image, which ships syft and grype (see README).
version: "3"

vars:
  FAIL_ON: high
  # FULL=true scans even when packages match the published image (nightly).
  FULL: "false"

tasks:
  sbom:
    desc: Write an SBOM per image to sbom/ (SPDX to share, syft json to scan)
    deps: [":images:build"]
    cmds:
      - mkdir -p sbom
      - for: { var: TARGETS }
        task: sbom:one
        vars: { FILE: "{{.ITEM}}" }

  scan:
    desc: Scan SBOMs whose packages differ from the published image, fail on FAIL_ON or worse
    deps: [sbom]
    cmds:
      - for: { var: TARGETS }
        task: scan:one
        vars: { FILE: "{{.ITEM}}" }

  scan:published:
    desc: Fully scan the published images in REGISTRY
    cmds:
      - mkdir -p sbom
      - for: { var: IMAGES }
        task: scan:published:one
        vars: { FILE: "{{.ITEM}}" }

  sbom:github:
    desc: Write a GitHub dependency snapshot per published image to sbom/ (GitHub Actions, uses GITHUB_RUN_ID, GITHUB_SHA, GITHUB_REF)
    cmds:
      - mkdir -p sbom
      - for: { var: IMAGES }
        task: sbom:github:one
        vars: { FILE: "{{.ITEM}}" }

  # Per image tasks; FILE is the Dockerfile path.

  sbom:one:
    internal: true
    vars: &image
      SCOPE: '{{.FILE | dir | base}}'
      SUFFIX: '{{.FILE | base | trimSuffix "Dockerfile" | trimSuffix "."}}'
      NAME: '{{.SCOPE}}{{if .SUFFIX}}-{{.SUFFIX}}{{end}}'
      VERSION: { sh: "sed -n 's/^ARG VERSION=//p' {{.FILE}}" }
      REF: "{{.REGISTRY}}/{{.NAME}}:{{.VERSION}}"
    env:
      SYFT_GOLANG_CAPTURE_SYMBOLS: all
    cmds:
      - syft {{.REF}} -q -o syft-json > sbom/{{.NAME}}.syft.json
      - syft convert sbom/{{.NAME}}.syft.json -q -o spdx-json > sbom/{{.NAME}}.spdx.json

  scan:one:
    internal: true
    vars: *image
    cmds:
      - |
        {{if ne .FULL "true"}}
        # Unchanged packages vs the published version: nightly covers new CVEs.
        if docker buildx imagetools inspect {{.REF}} > /dev/null 2>&1; then
          pkgs='[.artifacts[] | "\(.type) \(.name) \(.version)"] | sort | .[]'
          published=$(syft registry:{{.REF}} -q -o syft-json | jq -r "$pkgs")
          if [ -z "$published" ]; then
            echo "{{.NAME}}: could not read published SBOM, scanning"
          elif [ "$published" = "$(jq -r "$pkgs" sbom/{{.NAME}}.syft.json)" ]; then
            echo "{{.NAME}}: packages match published {{.REF}}, skipping scan"
            exit 0
          fi
        fi
        {{end}}
        grype -c "{{.ROOT_DIR}}/.grype.yaml" --fail-on {{.FAIL_ON}} sbom:sbom/{{.NAME}}.syft.json

  scan:published:one:
    internal: true
    vars: *image
    cmds:
      - docker pull -q {{.REF}}
      - task: sbom:one
        vars: { FILE: "{{.FILE}}" }
      - task: scan:one
        vars: { FILE: "{{.FILE}}", FULL: "true" }

  sbom:github:one:
    internal: true
    vars: *image
    cmds:
      # One snapshot per image (the correlator); the next submission for an image replaces it.
      - |
        syft registry:{{.REF}} -q -o github-json \
          | jq '.job = {correlator: "image-{{.NAME}}", id: env.GITHUB_RUN_ID} | .sha = env.GITHUB_SHA | .ref = env.GITHUB_REF' \
          > sbom/{{.NAME}}.github.json

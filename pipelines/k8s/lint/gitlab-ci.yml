# Validate kustomize manifests: render every overlay, then schema check and lint
# exactly what gets deployed. CI only, no deploy (GitOps does that).
#
# Add to .gitlab-ci.yml. Needs pipelines/k8s/lint/Taskfile.yml copied to
# .taskfiles/k8s/lint/Taskfile.yml and included as `k8s:lint`.

variables:
  K8S_DIR: k8s # directory with apps/, infrastructure/, ...
  K8S_IMAGE: ghcr.io/twanvanparidon/ci-runner/k8s:1.4.0@sha256:2ee36083e002aa33e84ad26c5336dee6bf45e2ce7d0ca130dd1ddc4ae3908611

stages:
  - lint

# MR pipelines for MRs, branch pipelines otherwise; never both.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.k8s:
  stage: lint
  image: $K8S_IMAGE
  # Only when the manifests or the lint setup change; keep k8s/ in sync with K8S_DIR.
  rules:
    - changes:
        - k8s/**/*
        - Taskfile.yml
        - .taskfiles/k8s/lint/**/*
        - .gitlab-ci.yml

k8s-build:
  extends: .k8s
  script: [task k8s:lint:render]
  artifacts:
    paths: [rendered/]
    expire_in: 1 day

k8s-schema:
  extends: .k8s
  needs: [k8s-build]
  script: [task k8s:lint:schema]

k8s-lint:
  extends: .k8s
  needs: [k8s-build]
  script: [task k8s:lint:kube-linter]

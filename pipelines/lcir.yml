# lcir (local ci runner): run tasks locally, in the image your pipeline uses.
# Copy to .taskfiles/lcir.yml and include it with the pipeline's image:
#   includes:
#     lcir:
#       taskfile: .taskfiles/lcir.yml
#       optional: true # host only; the container does not need it
#       vars: { IMAGE: ghcr.io/twanvanparidon/ci-runner/docker:<version> }
# Then: task lcir                       list the tasks, as the image sees them
#       task lcir:<task>                run a task in the image
#       task lcir:<task> -- VAR=value   pass variables to the task
# Mirror a pipeline job with its own image from another task:
#   - task: :lcir:run
#     vars: { IMAGE: ghcr.io/twanvanparidon/ci-runner/k8s:<version>, STEP: k8s:validate }
# Needs Docker and Task on the host. Mounts the git repository root at the same
# path, runs from the current directory as your user.
version: "3"

vars:
  # Docker socket group: 0 on Docker Desktop, the docker group on Linux.
  DOCKER_GID:
    sh: stat -Lc %g /var/run/docker.sock 2> /dev/null || stat -Lf %g /var/run/docker.sock 2> /dev/null || echo 0

tasks:
  # Only this task is listed; the others are hidden to keep `task --list` clean.
  default:
    desc: List the tasks to run locally in the CI image (task lcir:<task>)
    cmds:
      - task: run
        vars: { STEP: --list }

  # task lcir:<task> [-- VAR=value]
  "*":
    cmds:
      - task: run
        vars: { STEP: "{{index .MATCH 0}}" }

  # Run STEP in IMAGE; for pipeline mirrors (task: :lcir:run). No desc keeps it unlisted.
  run:
    vars:
      # Resolved per call, so a caller's IMAGE always wins over the include's.
      RUN_IMAGE: '{{.IMAGE | default "ghcr.io/twanvanparidon/ci-runner/general:latest"}}'
      ROOT:
        sh: git rev-parse --show-toplevel 2> /dev/null || pwd
    cmds:
      - >
        docker run --rm $([ -t 0 ] && [ -t 1 ] && echo -it)
        {{if hasSuffix ":latest" .RUN_IMAGE}}--pull always{{end}}
        -v /var/run/docker.sock:/var/run/docker.sock --group-add 0 --group-add {{.DOCKER_GID}}
        -v "{{.ROOT}}:{{.ROOT}}" -w "$PWD" --user "$(id -u):$(id -g)" -e HOME=/tmp
        {{.RUN_IMAGE}} task {{.STEP}} {{.CLI_ARGS}}

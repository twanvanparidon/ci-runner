version: "3"

includes:
  images: .Taskfiles/images.yml
  security: .Taskfiles/security.yml
  lint: .Taskfiles/lint.yml

vars:
  REGISTRY: ci-runner
  # Build order matters: base images first.
  # <scope>/images/Dockerfile is image <scope>, <scope>/images/<name>.Dockerfile is <scope>-<name>.
  IMAGES: >
    general/images/Dockerfile
    k8s/images/linter.Dockerfile
    docker/images/linter.Dockerfile

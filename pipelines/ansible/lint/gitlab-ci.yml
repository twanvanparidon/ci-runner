# Lint Ansible playbooks and roles with ansible-lint. CI only, nothing runs against hosts.
#
# Add to .gitlab-ci.yml. Needs pipelines/ansible/lint/Taskfile.yml copied to
# .taskfiles/ansible/lint/Taskfile.yml and included as `ansible:lint`.

variables:
  ANSIBLE_DIR: ansible
  ANSIBLE_IMAGE: ghcr.io/twanvanparidon/ci-runner/ansible:1.0.0

stages:
  - lint

# MR pipelines for MRs, branch pipelines otherwise; never both.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.ansible:
  stage: lint
  image: $ANSIBLE_IMAGE
  # Only when the code or the lint setup change; keep ansible/ in sync with ANSIBLE_DIR.
  rules:
    - changes:
        - ansible/**/*
        - Taskfile.yml
        - .taskfiles/ansible/lint/**/*
        - .gitlab-ci.yml

ansible-lint:
  extends: .ansible
  script: [task ansible:lint]

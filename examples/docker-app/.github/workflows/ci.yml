# Every step is a `ci` call in the ci-runner docker image:
# ci:docker:* are built in, smoke comes from the project's Taskfile.
name: ci
on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.2.0@sha256:e597a03c863305ac33a93d9562b1472046df40633cd051cc463c70846cf90491
      options: --user 1001 # the runner user, owns the workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci ci:docker:lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.2.0@sha256:e597a03c863305ac33a93d9562b1472046df40633cd051cc463c70846cf90491
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci ci:docker:build IMAGE=docker-app:dev
      - run: ci smoke

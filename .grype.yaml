# Accepted scan findings, one entry per advisory (no package version): a tool bump does not
# re-raise a judged advisory, a new advisory still fails the scan. Entries are grouped by why
# the risk is accepted; add a new one to its group, or fix it (bump the tool) and remove it.
# Reviewed 2026-10-10 (#17). Remove entries that no longer match anything.

ignore:

  # Server or daemon side: the tools are CLI clients and run no server, gRPC service,
  # container runtime or Docker daemon in CI.
  - vulnerability: GHSA-2v4p-qf9q-27wj  # High: Server panic via missing authority or Host headers
    #   google.golang.org/grpc in cosign
    reason: "server or daemon side code; no server runs in CI"

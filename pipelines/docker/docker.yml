# Docker steps. Copy to .taskfiles/docker.yml and include it as `docker`.
# Runs in the ci-runner docker image (hadolint, docker buildx).
# Variables are per task: included Taskfiles share file-level vars.
version: "3"

tasks:
  lint:
    desc: hadolint every Dockerfile (or DOCKERFILES), fail after checking all
    cmds:
      - |
        files="{{.DOCKERFILES}}"
        [ -n "$files" ] || files="$(find . \( -name Dockerfile -o -name '*.Dockerfile' \) -not -path './.git/*' | sort)"
        rc=0
        for f in $files; do
          echo "== $f"
          hadolint "$f" || rc=1
        done
        exit $rc

  build:
    desc: Build IMAGE (DOCKERFILE=Dockerfile, CONTEXT=., BUILD_ARGS)
    requires:
      vars: [IMAGE]
    vars:
      DOCKERFILE: '{{.DOCKERFILE | default "Dockerfile"}}'
      CONTEXT: '{{.CONTEXT | default "."}}'
    cmds:
      - docker buildx build -f {{.DOCKERFILE}} {{.BUILD_ARGS}} -t {{.IMAGE}} --load {{.CONTEXT}}

# Lint every Dockerfile. Add to .gitlab-ci.yml. Needs pipelines/docker/lint/Taskfile.yml
# copied to .taskfiles/docker/lint/Taskfile.yml and included as `docker:lint`.

docker-lint:
  image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.0@sha256:232b42571cabac0bc690edacd2a00fb365ec11bfda61a784f4f6f60bf7a8a294
  script: [task docker:lint]

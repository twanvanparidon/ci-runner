name: images

on:
  pull_request:
    # Only what feeds an image; docs, READMEs and ci/ examples never trigger it.
    paths:
      - "src/*/images/**"
      - "src/*/scripts/**"
      - "src/*/tasks.yml"
      - "src/*/.dockerignore"
      - "Taskfile.yml"
      - ".Taskfiles/**"
      - ".grype.yaml"
      - ".hadolint.yaml"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "src/*/images/**"
      - "src/*/scripts/**"
      - "src/*/tasks.yml"
      - "src/*/.dockerignore"
      - "Taskfile.yml"
      - ".Taskfiles/**"
      - ".grype.yaml"
      - ".hadolint.yaml"
      - ".github/workflows/images.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: echo "BASE_REF=origin/$GITHUB_BASE_REF" >> "$GITHUB_ENV"
      - run: task images:check REGISTRY="$REGISTRY" BASE_REF="$BASE_REF"
      # REGISTRY: pinned images not built in this PR are pulled from GHCR.
      # CHANGED_ONLY: only images whose images/, scripts/ or .dockerignore changed.
      - run: task lint:dockerfiles REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BASE_REF"
      - run: task security:scan REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BASE_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom/

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push git tags
      packages: write # push images
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Scan first: it builds on the local docker builder, which setup-buildx replaces.
      - run: task security:scan REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: task images:release REGISTRY="$REGISTRY"

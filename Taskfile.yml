version: "3"

includes:
  images: .Taskfiles/images.yml
  security: .Taskfiles/security.yml
  lint: .Taskfiles/lint.yml

vars:
  REGISTRY: ci-runner
  # Build order matters: base images first.
  # images/<scope>/images/Dockerfile is image <scope>, images/<scope>/images/<name>.Dockerfile is <scope>-<name>.
  IMAGES: >
    images/builder/images/Dockerfile
    images/general/images/Dockerfile
    images/k8s/images/Dockerfile
    images/docker/images/Dockerfile
  BASE_REF: origin/main
  # CHANGED_ONLY=true limits build, lint, sbom and scan to images whose images/,
  # scripts/, tasks.yml or .dockerignore changed since BASE_REF (CI). Shared files select all.
  CHANGED_ONLY: "false"
  SHARED: Taskfile.yml .Taskfiles .grype.yaml .hadolint.yaml .github/workflows/images.yml
  TARGETS:
    sh: |
      all="{{.IMAGES | trim}}"
      if [ "{{.CHANGED_ONLY}}" != true ] \
        || ! git cat-file -e "{{.BASE_REF}}^{commit}" 2> /dev/null \
        || ! git diff --quiet "{{.BASE_REF}}" -- {{.SHARED}}; then
        echo "$all"; exit 0
      fi
      for f in $all; do
        scope=$(dirname "$(dirname "$f")")
        git diff --quiet "{{.BASE_REF}}" -- "$scope/images" "$scope/scripts" "$scope/tasks.yml" "$scope/.dockerignore" || echo "$f"
      done

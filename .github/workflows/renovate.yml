name: renovate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Commits what Renovate cannot do on its own: the aqua lock files (task images:lock) and a
# patch bump of every changed image (task images:bump), or images:check fails.
# Pushes with RENOVATE_GLUE_TOKEN, since pushes with GITHUB_TOKEN trigger no workflows and
# images.yml must run on the result. renovate.json5 lists the commit author in gitIgnoredAuthors.

jobs:
  glue:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: renovate-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.RENOVATE_GLUE_TOKEN }}
      # A host job running the image, not a container job: images:lock bind mounts the
      # checkout into docker run, so both must see the same path. Same pin as images.yml.
      - name: Lock and bump
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp \
            ghcr.io/twanvanparidon/ci-runner/docker:1.3.1@sha256:0b74e9e060f2a780f4fb55940236561c5dcac189d1732710926aeb239531919b \
            sh -c 'task images:lock && task images:bump BASE_REF="$(git merge-base origin/main HEAD)"'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): lock aqua checksums and bump image versions"
          git push

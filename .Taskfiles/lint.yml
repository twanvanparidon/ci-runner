version: "3"

tasks:
  dockerfiles:
    desc: Lint every image Dockerfile with hadolint from the docker image
    deps: [":images:build"]
    vars:
      LINTER:
        sh: echo "{{.REGISTRY}}/docker:$(sed -n 's/^ARG VERSION=//p' src/docker/images/Dockerfile)"
    cmds:
      - |
        set -o pipefail
        rc=0
        for f in {{.TARGETS | trim}}; do
          docker run --rm -i -v "{{.ROOT_DIR}}/.hadolint.yaml:/.hadolint.yaml:ro" {{.LINTER}} \
            hadolint --no-color --config /.hadolint.yaml - < "$f" | sed "s|^-:|$f:|" || rc=1
        done
        exit $rc

# Local mirror of .github/workflows/ci.yml: same jobs, same image, same steps.
# task pipeline runs all jobs in order, task pipeline:<job> one job,
# task lcir:<step> a single step.
version: "3"

vars:
  # Not IMAGE: included Taskfiles share variables, so names must not collide.
  PIPELINE_IMAGE: ghcr.io/twanvanparidon/ci-runner/docker:1.2.0@sha256:e597a03c863305ac33a93d9562b1472046df40633cd051cc463c70846cf90491

tasks:
  default:
    desc: Whole pipeline (lint, then build)
    cmds:
      - task: lint
      - task: build
      - task: :lcir:smoke

  lint:
    desc: Job lint
    cmds:
      - task: :lcir:run
        vars: { IMAGE: "{{.PIPELINE_IMAGE}}", STEP: docker:lint }

  build:
    desc: Job build
    cmds:
      - task: :lcir:run
        vars: { IMAGE: "{{.PIPELINE_IMAGE}}", STEP: "docker:build IMAGE=docker-app:dev" }

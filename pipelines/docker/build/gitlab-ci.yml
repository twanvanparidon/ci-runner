# Build the image. Add to .gitlab-ci.yml. Needs pipelines/docker/build/Taskfile.yml
# copied to .taskfiles/docker/build/Taskfile.yml and included as `docker:build`.
# Builds on a docker-in-docker service (see docs/builders.md for other builders).

docker-build:
  image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.2@sha256:1d605a124eab031b37feec9aab90ace01686edcd4e3a6daf44c7aa78751d48e6
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - eval "$(ci_env)" # same CI_* variables as on GitHub
    - task docker:build IMAGE="$CI_REGISTRY_IMAGE:$CI_SHORT_SHA"

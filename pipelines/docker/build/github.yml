# Build the image. Copy to .github/workflows/docker-build.yml. Needs
# pipelines/docker/build/Taskfile.yml copied to .taskfiles/docker/build/Taskfile.yml
# and included as `docker:build`. Builds on the runner's Docker, which GitHub
# mounts into container jobs; 118 is its socket group on GitHub's Ubuntu runners.

name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.1@sha256:0b74e9e060f2a780f4fb55940236561c5dcac189d1732710926aeb239531919b
      options: --user 1001:1001 --group-add 118 # runner user, docker socket group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ci_env gives the same CI_* variables on GitHub and GitLab.
      - run: |
          eval "$(ci_env)"
          task docker:build IMAGE="$CI_REGISTRY_IMAGE:$CI_SHORT_SHA"

# Shared steps come from .taskfiles/docker.yml (a copy of pipelines/docker/docker.yml);
# smoke is this project's own step. Locally `task lcir:<task>` runs any of them in the CI image.
version: "3"

includes:
  docker: .taskfiles/docker.yml
  lcir:
    taskfile: .taskfiles/lcir.yml
    optional: true # host only; skipped inside the container
    vars: { IMAGE: ghcr.io/twanvanparidon/ci-runner/docker:1.2.0@sha256:e597a03c863305ac33a93d9562b1472046df40633cd051cc463c70846cf90491 }
  pipeline: .taskfiles/pipeline.yml

vars:
  APP_IMAGE: docker-app:dev

tasks:
  smoke:
    desc: Run the built image and check its output
    cmds:
      - docker run --rm {{.APP_IMAGE}} | grep -q "hello from docker-app"
      - echo "smoke test passed for {{.APP_IMAGE}}"

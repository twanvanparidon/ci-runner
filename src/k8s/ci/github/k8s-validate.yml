# Validate kustomize manifests: render every overlay, then schema check and lint
# exactly what gets deployed. CI only, no deploy (GitOps does that).
#
# Use: copy to .github/workflows/k8s-validate.yml.

name: k8s-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  K8S_DIR: k8s # directory with apps/, infrastructure/, ...

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/k8s:1.2.0@sha256:ea5fb620c7b94247188d5885e546b3096905cc6ec139307b8d57a9062e45299c
      # Run as the hosted runner's user (owns the workspace) instead of root.
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: kustomize build
        run: OUT=rendered kustomize_build_all "$K8S_DIR"

      - name: kubeconform
        # CRDs: schemas from the community CRDs catalog, skip what is not in it.
        run: >
          kubeconform -strict -summary -ignore-missing-schemas
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          rendered

      - name: kube-linter
        # kube-linter only auto-loads .kube-linter.yaml from the working dir, so pass it.
        run: |
          KUBE_LINTER_CONFIG="${KUBE_LINTER_CONFIG:-$K8S_DIR/.kube-linter.yaml}"
          if [ -f "$KUBE_LINTER_CONFIG" ]; then set -- --config "$KUBE_LINTER_CONFIG"; fi
          kube-linter lint "$@" rendered

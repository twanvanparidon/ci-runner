# Validate kustomize manifests: render every overlay, then schema check and lint
# exactly what gets deployed. CI only, no deploy (GitOps does that).
#
# Use: copy into .gitlab-ci.yml, or
#   include:
#     - remote: https://raw.githubusercontent.com/twanvanparidon/ci-runner/main/src/k8s/ci/gitlab/k8s-validate.gitlab-ci.yml

variables:
  K8S_DIR: k8s # directory with apps/, infrastructure/, ...
  K8S_IMAGE: ghcr.io/twanvanparidon/ci-runner/k8s:1.3.0@sha256:d6bc1703031ddd91054ae2f6be70b107127ea0fd25be5333375203514417a247

stages:
  - lint

# MR pipelines for MRs, branch pipelines otherwise; never both.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.k8s:
  stage: lint
  image: $K8S_IMAGE

kustomize-build:
  extends: .k8s
  script:
    - OUT="$CI_PROJECT_DIR/rendered" kustomize_build_all "$K8S_DIR"
  artifacts:
    paths: [rendered/]
    expire_in: 1 day

kubeconform:
  extends: .k8s
  needs: [kustomize-build]
  script:
    # CRDs: schemas from the community CRDs catalog, skip what is not in it.
    - >
      kubeconform -strict -summary -ignore-missing-schemas
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      rendered

kube-linter:
  extends: .k8s
  needs: [kustomize-build]
  script:
    # kube-linter only autoloads .kube-linter.yaml from the working dir, so pass it.
    - KUBE_LINTER_CONFIG="${KUBE_LINTER_CONFIG:-$K8S_DIR/.kube-linter.yaml}"
    - if [ -f "$KUBE_LINTER_CONFIG" ]; then set -- --config "$KUBE_LINTER_CONFIG"; fi
    - kube-linter lint "$@" rendered

# On a release tag, point the GitOps repo's overlay at the new image.
# Add to .gitlab-ci.yml. Needs pipelines/k8s/gitops/Taskfile.yml copied to
# .taskfiles/k8s/gitops/Taskfile.yml and included as `k8s:gitops`, and a masked
# GITOPS_TOKEN variable (project access token with write_repository on the GitOps repo).

gitops:
  image: ghcr.io/twanvanparidon/ci-runner/k8s:1.4.2@sha256:9028d7d0f7226dabb58ccf485eab00ce3a0e4274b7541abd55468f59b9a8b13c
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - git clone "https://gitlab-ci-token:${GITOPS_TOKEN}@gitlab.com/me/gitops.git" gitops # your GitOps repo
    - eval "$(ci_env)" # same CI_* variables as on GitHub
    - task k8s:gitops DIR=gitops OVERLAY=apps/web/overlays/prod IMAGES="web=$CI_REGISTRY_IMAGE:$CI_TAG"

# Lint every Dockerfile. Copy to .github/workflows/docker-lint.yml. Needs
# pipelines/docker/lint/Taskfile.yml copied to .taskfiles/docker/lint/Taskfile.yml
# and included as `docker:lint`.

name: docker-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.1@sha256:0b74e9e060f2a780f4fb55940236561c5dcac189d1732710926aeb239531919b
      options: --user 1001:1001 # the runner user, owns the workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: task docker:lint

# Runs inside the docker image, which ships hadolint (see README).
version: "3"

tasks:
  dockerfiles:
    desc: Lint every image Dockerfile (or the changed ones) with hadolint
    cmds:
      - |
        rc=0
        for f in {{.TARGETS | catLines}}; do
          hadolint --no-color --config "{{.ROOT_DIR}}/.hadolint.yaml" "$f" || rc=1
        done
        exit $rc

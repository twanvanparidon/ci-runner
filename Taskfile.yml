version: "3"

includes:
  images: .Taskfiles/images.yml
  security: .Taskfiles/security.yml
  lint: .Taskfiles/lint.yml

vars:
  REGISTRY: ci-runner
  # Build order matters: base images first.
  # src/<scope>/images/Dockerfile is image <scope>, src/<scope>/images/<name>.Dockerfile is <scope>-<name>.
  IMAGES: >
    src/builder/images/Dockerfile
    src/general/images/Dockerfile
    src/k8s/images/linter.Dockerfile
    src/docker/images/linter.Dockerfile

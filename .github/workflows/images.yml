name: images

on:
  pull_request:
    # Only what feeds an image; docs, READMEs and pipelines/ never trigger it.
    paths:
      - "images/*/Dockerfile"
      - "images/*/*.Dockerfile"
      - "images/*/aqua*"
      - "images/*/scripts/**"
      - "images/*/.dockerignore"
      - "Taskfile.yml"
      - ".taskfiles/**"
      - ".grype.yaml"
      - ".hadolint.yaml"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "images/*/Dockerfile"
      - "images/*/*.Dockerfile"
      - "images/*/aqua*"
      - "images/*/scripts/**"
      - "images/*/.dockerignore"
      - "Taskfile.yml"
      - ".taskfiles/**"
      - ".grype.yaml"
      - ".hadolint.yaml"
      - ".github/workflows/images.yml"

permissions:
  contents: read

# Every job runs in this repo's own docker image, pinned to the last release: a broken
# new release cannot break the pipeline that fixes it. Keep the three pins in sync.
# --user 1001:1001 is the runner user (owns the workspace), 118 the docker socket group.

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.0@sha256:232b42571cabac0bc690edacd2a00fb365ec11bfda61a784f4f6f60bf7a8a294
      options: --user 1001:1001 --group-add 118
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Log in and set variables
        run: |
          eval "$(ci_env)"
          echo "$TOKEN" | docker login ghcr.io -u "$CI_ACTOR" --password-stdin
          echo "REGISTRY=$CI_REGISTRY_IMAGE" >> "$GITHUB_ENV"
          echo "BASE_REF=origin/$CI_PR_TARGET" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: task images:check REGISTRY="$REGISTRY" BASE_REF="$BASE_REF"
      # REGISTRY: pinned images not built in this PR are pulled from GHCR.
      # CHANGED_ONLY: only images whose Dockerfile, aqua files, scripts/ or .dockerignore changed.
      - run: task lint:dockerfiles REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BASE_REF"
      - run: task security:scan REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BASE_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom/

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push git tags
      packages: write # push images
      id-token: write # keyless cosign signing
    container:
      image: ghcr.io/twanvanparidon/ci-runner/docker:1.3.0@sha256:232b42571cabac0bc690edacd2a00fb365ec11bfda61a784f4f6f60bf7a8a294
      options: --user 1001:1001 --group-add 118
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Log in and set variables
        run: |
          eval "$(ci_env)"
          echo "$TOKEN" | docker login ghcr.io -u "$CI_ACTOR" --password-stdin
          echo "REGISTRY=$CI_REGISTRY_IMAGE" >> "$GITHUB_ENV"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Scan first: it builds on the local docker builder, which setup-buildx replaces.
      - run: task security:scan REGISTRY="$REGISTRY" CHANGED_ONLY=true BASE_REF="$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: task images:release REGISTRY="$REGISTRY"
